replicaCount: 2

image:
  repository: omnipayx/payment-api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  SPRING_PROFILES_ACTIVE: "staging"
  # DB credentials should be injected via External Secrets in a real setup
  # SPRING_DATASOURCE_URL: "jdbc:postgresql://<rds-endpoint>:5432/omnipayx_db"
