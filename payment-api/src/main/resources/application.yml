spring:
  application:
    name: payment-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/omnipayx}
    username: ${DB_USERNAME:omnipayx_user}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info # Mở toang cửa cho Prometheus vào đo lường
  tracing:
    sampling:
      probability: 1.0 # Bắt 100% request. (Trên Prod xịn chỉ nên set 0.1 để đỡ tốn ổ cứng)
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans" # Gửi tín hiệu về máy chủ Zipkin
