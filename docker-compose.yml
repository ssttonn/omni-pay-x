version: '3.8'

services:
  # --- 3.1. PostgreSQL (Core Database) ---
  postgres:
    image: postgres:15-alpine
    container_name: omnipayx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnipayx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-omnipayx}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sử dụng nội suy biến cho username và DB name để đồng bộ với environment
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnipayx_user} -d ${POSTGRES_DB:-omnipayx}"]
      interval: 10s
      retries: 5

  # --- 3.2. Redis (Rate Limit & Idempotency) ---
  redis:
    image: redis:7-alpine
    container_name: omnipayx-redis
    ports:
      - "6379:6379"

  # --- 3.3. Kafka & Zookeeper (Event Bus) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omnipayx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omnipayx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # --- 3.4. WireMock (Giả lập Stripe API) ---
  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: omnipayx-wiremock
    ports:
      - "8081:8080"
    command: ["--global-response-templating"]

  # --- 3.5. Zipkin (Tracing) ---
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: omnipayx-zipkin
    ports:
      - "9411:9411"

  # --- 3.6. Application Services ---
  payment-api:
    build:
      context: .
      dockerfile: payment-api/Dockerfile
    container_name: omnipayx-payment-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=${POSTGRES_URL:-jdbc:postgresql://postgres:5432/omnipayx}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-omnipayx_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-secretpassword}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  routing-engine:
    build:
      context: .
      dockerfile: routing-engine/Dockerfile
    container_name: omnipayx-routing-engine
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  stripe-connector:
    build:
      context: .
      dockerfile: stripe-connector/Dockerfile
    container_name: omnipayx-stripe-connector
    ports:
      - "8083:8080"
    depends_on:
      kafka:
        condition: service_started
      wiremock:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - STRIPE_API_BASE_URL=${STRIPE_API_BASE_URL:-http://wiremock:8080}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

volumes:
  pgdata:
