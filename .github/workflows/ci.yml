name: OmniPayX CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================
  # JOB 1: Path Filtering
  # ==========================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      payment: ${{ steps.filter.outputs.payment }}
      routing: ${{ steps.filter.outputs.routing }}
      stripe: ${{ steps.filter.outputs.stripe }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            payment:
              - 'payment-api/**'
            routing:
              - 'routing-engine/**'
            stripe:
              - 'stripe-connector/**'

  # ==========================================
  # JOB 2: Build Payment API
  # ==========================================
  build-payment-api:
    needs: changes
    if: ${{ needs.changes.outputs.payment == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: |
          cd payment-api
          mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          cd payment-api
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-payment-api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-payment-api:latest

  # ==========================================
  # JOB 3: Build Routing Engine
  # ==========================================
  build-routing-engine:
    needs: changes
    if: ${{ needs.changes.outputs.routing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: |
          cd routing-engine
          mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          cd routing-engine
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-routing-engine:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-routing-engine:latest

  # ==========================================
  # JOB 4: Build Stripe Connector
  # ==========================================
  build-stripe-connector:
    needs: changes
    if: ${{ needs.changes.outputs.stripe == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: |
          cd stripe-connector
          mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          cd stripe-connector
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-stripe-connector:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-stripe-connector:latest

  # ==========================================
  # JOB 5: Deploy to Staging EKS Cluster
  # ==========================================
  deploy-staging:
    # We only deploy if ALL the build jobs are successful
    needs:
      [changes, build-payment-api, build-routing-engine, build-stripe-connector]
    # We also only want to deploy if at least one service actually changed!
    if: |
      needs.changes.outputs.payment == 'true' || 
      needs.changes.outputs.routing == 'true' || 
      needs.changes.outputs.stripe == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Update Kubeconfig
        run: |
          # Grabs the auth token from AWS to allow us to talk to EKS
          aws eks update-kubeconfig --name omnipayx-staging-cluster --region us-east-1
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Deploy Payment API (If changed)
        if: ${{ needs.changes.outputs.payment == 'true' }}
        run: |
          # Upgrades the helm release named 'payment-api' in the 'staging' namespace
          helm upgrade --install payment-api ./deploy/helm/payment-api \
            --namespace staging \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-payment-api \
            --set image.tag=latest

      - name: Deploy Routing Engine (If changed)
        if: ${{ needs.changes.outputs.routing == 'true' }}
        run: |
          helm upgrade --install routing-engine ./deploy/helm/routing \
            --namespace staging \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-routing-engine \
            --set image.tag=latest

      - name: Deploy Stripe Connector (If changed)
        if: ${{ needs.changes.outputs.stripe == 'true' }}
        run: |
          helm upgrade --install stripe-connector ./deploy/helm/stripe \
            --namespace staging \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/omnipayx-stripe-connector \
            --set image.tag=latest
